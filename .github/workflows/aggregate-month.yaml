name: Aggregate BGG Hotness Spreadsheet (One month)
on:
  schedule:
  # 1st of each month only. cron ORs day-of-month and day-of-week, so the old
  # "0 14 1 * 1" fired on the 1st AND every Monday (~9 runs/month); the empty
  # day-of-week field ("*") restricts it to the 1st.
  - cron: "0 14 1 * *"
  workflow_dispatch:

jobs:
  fetch:
    name: Aggregate data for the past month in a page
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
      - name: Prepare feed branch worktree
        # Check the feed branch out into its own worktree so main.go can read the
        # existing feed and rewrite it in place (read-modify-write), and the commit
        # below never force-pushes — two aggregate runs land on the same Monday, so
        # a from-scratch generate-and-force would drop the earlier one. The branch
        # ref is fetched explicitly because checkout@v3 only brings the default branch.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin feed >/dev/null 2>&1; then
            git fetch origin feed
            git worktree add feed-branch FETCH_HEAD
            git -C feed-branch switch -C feed
          else
            git worktree add --detach feed-branch
            git -C feed-branch switch --orphan feed
            git -C feed-branch read-tree --empty
          fi
      - id: bgghotness
        run: |
          go run ./aggregate -days=30 >> ${GITHUB_OUTPUT}
        env:
          DOCUMENT_ID: ${{ secrets.DOCUMENT_ID }}
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          # Monthly writes its OWN feed file (feed.go renders three separate feeds). The
          # feed id derives from this basename (feed-monthly.xml -> ...:feed-monthly); do
          # NOT point this at feed.xml — that is the live weekly feed and this run would
          # re-identify and overwrite it.
          FEED_FILE: ${{ github.workspace }}/feed-branch/feed-monthly.xml
          FEED_TITLE: "BGG Hotness Aggregates (Monthly)"
      - id: 'update_worksheet'
        uses: jroehl/gsheet.action@v2.0.0 # you can specify '@release' to always have the latest changes
        with:
          spreadsheetId: ${{ secrets.DOCUMENT_ID }}
          commands: | # list of commands, specified as a valid JSON string
            ${{ steps.bgghotness.outputs.data_array }}
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GOOGLE_SECRET }}
      - name: dump results
        env:
          #  the output of the action can be found in ${{ steps.update_worksheet.outputs.results }}
          RESULTS: ${{ steps.update_worksheet.outputs.results }}
        run: echo "$RESULTS" | jq
      - name: Publish feed
        working-directory: feed-branch
        run: |
          set -euo pipefail
          [ -f feed-monthly.xml ] || { echo "no feed produced; skipping"; exit 0; }
          git add feed-monthly.xml
          if git diff --cached --quiet; then
            echo "feed unchanged; nothing to commit"
          else
            git commit -m "chore(feed): update from ${{ github.workflow }}"
            git push origin HEAD:feed
          fi
